<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Donate - HopeFund</title>
  <link rel="stylesheet" href="styles.css" />
  <script src="https://www.paypal.com/sdk/js?client-id=ATYoGgQ55-Yt1E3Mhme64RtLC_aYnQJFaMz3isv4pvULQmbSVxg-rPLLPuC6idxIpmpTMCFJL4BXW6Rd"></script>
  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background-color: #f9f9f9;
      color: #333;
    }
    header {
      background-color: #0a4275;
      color: white;
      padding: 20px;
      text-align: center;
    }
    nav {
      background-color: #063158;
      padding: 10px;
      text-align: center;
    }
    nav a {
      color: white;
      margin: 0 15px;
      text-decoration: none;
      font-weight: bold;
    }
    .hero {
      padding: 60px 20px;
      background: #eaf4ff;
      text-align: center;
    }
    .hero h1 {
      font-size: 36px;
      margin-bottom: 20px;
    }
    .hero p {
      font-size: 18px;
      max-width: 600px;
      margin: auto;
    }
    .hero button {
      margin-top: 30px;
      padding: 12px 24px;
      font-size: 16px;
      background-color: #0a4275;
      color: white;
      border: none;
      border-radius: 5px;
      cursor: pointer;
    }
    .section {
      padding: 40px 20px;
      max-width: 1000px;
      margin: auto;
    }
    .section h2 {
      text-align: center;
      margin-bottom: 30px;
    }

    footer {
      background-color: #063158;
      color: white;
      text-align: center;
      padding: 20px;
    }
    footer a {
      color: #f9d342;
      text-decoration: none;
    }
  </style>
</head>
<body>
    <header>
        <h1>HopeFund</h1>
        <p>Give Hope. Make a Difference.</p>
      </header>
  <nav>
    <a href="index.html">Home</a>
    <a href="donate.html">Donate</a>
    <a href="campaigns.html">Campaigns</a>
    <a href="about.html">About Us</a>
    <a href="contact.html">Contact</a>
  </nav>
  <main>
    <form id="donationForm">
      <label>Your Name: <input type="text" id="name" required></label><br>
      <label>Email: <input type="email" id="email" required></label><br>
      <label>Amount ($): <input type="number" id="amount" min="1" required></label><br>
    </form>

    <!-- PayPal button container -->
    <div id="paypal-button-container"></div>
  </main>

  <script>
    paypal.Buttons({
      createOrder: function(data, actions) {
        const amount = document.getElementById('amount').value;

        if (!amount || amount <= 0) {
          alert("Please enter a valid donation amount.");
          return;
        }

        return actions.order.create({
          purchase_units: [{
            amount: {
              value: amount
            },
            description: 'Donation to your organization'
          }]
        });
      },
      onApprove: function(data, actions) {
        return actions.order.capture().then(function(details) {
          alert('Thank you, ' + details.payer.name.given_name + '! Your donation was successful.');
          // Optionally redirect to thank-you page or send data to server
        });
      },
      onError: function(err) {
        console.error(err);
        alert("An error occurred during the transaction.");
      }
    }).render('#paypal-button-container');
  </script>
  <footer>
    <p>&copy; 2025 HopeFund. All rights reserved. | <a href="#">Privacy Policy</a></p>
  </footer>
</body>
</html>
